<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlaceSense - Sign In</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .role-btn {
      border: 2px solid #dbe3ef;
      color: #475569;
      transition: all 0.2s ease;
    }

    .role-btn.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .form-input {
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
      outline: none;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-100">

  <!-- Right-side login panel only -->
  <main class="flex min-h-screen items-center justify-center bg-white px-5 py-10 sm:px-10">

    <div class="w-full max-w-md">

      <!-- Heading -->
      <div class="mb-10">
        <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
          Sign in to your account
        </h1>

        <p class="mt-4 text-sm leading-6 text-slate-500 sm:text-base">
          Enter your details to access your PlaceSense workspace.
        </p>
      </div>

      <!-- Role selection -->
      <div class="mb-8">
        <label class="mb-4 block text-sm font-bold text-slate-800">
          Select your role
        </label>

        <div class="grid grid-cols-3 gap-3">

          <button type="button"
            class="role-btn active flex flex-col items-center justify-center gap-3 rounded-2xl px-2 py-5 text-sm font-medium"
            data-role="Student">

            <i data-lucide="graduation-cap" class="h-6 w-6"></i>
            Student
          </button>

          <button type="button"
            class="role-btn flex flex-col items-center justify-center gap-3 rounded-2xl px-2 py-5 text-sm font-medium"
            data-role="Admin">

            <i data-lucide="shield-check" class="h-6 w-6"></i>
            Admin
          </button>

          <button type="button"
            class="role-btn flex flex-col items-center justify-center gap-3 rounded-2xl px-2 py-5 text-sm font-medium"
            data-role="Company">

            <i data-lucide="building-2" class="h-6 w-6"></i>
            Company
          </button>

        </div>
      </div>

      <!-- Login form -->
      <form id="loginForm" class="space-y-6">

        <!-- Email -->
        <div>
          <label for="email"
            class="mb-3 block text-sm font-bold text-slate-800">
            Email address
          </label>

          <div class="relative">
            <i data-lucide="mail"
              class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-blue-400"></i>

            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
              class="form-input w-full rounded-2xl border border-slate-200 bg-white py-4 pl-12 pr-4 text-sm text-slate-800 placeholder:text-slate-400">
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="mb-3 flex items-center justify-between">
            <label for="password"
              class="text-sm font-bold text-slate-800">
              Password
            </label>

            <button type="button" id="forgotPassword"
              class="text-sm font-semibold text-blue-600 hover:text-blue-800">
              Forgot password?
            </button>
          </div>

          <div class="relative">
            <i data-lucide="lock-keyhole"
              class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-blue-400"></i>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              class="form-input w-full rounded-2xl border border-slate-200 bg-white py-4 pl-12 pr-12 text-sm text-slate-800 placeholder:text-slate-400">

            <button type="button" id="togglePassword"
              aria-label="Show password"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600">

              <i data-lucide="eye" class="h-5 w-5"></i>
            </button>
          </div>
        </div>

        <!-- Remember me -->
        <div class="flex items-center justify-between gap-3">

          <label class="flex cursor-pointer items-center gap-2 text-sm text-slate-500">
            <input
              type="checkbox"
              id="remember"
              checked
              class="h-5 w-5 rounded border-slate-300 accent-blue-600">

            Remember me
          </label>

          <span class="flex items-center gap-2 text-xs text-slate-400 sm:text-sm">
            <i data-lucide="shield-check" class="h-4 w-4"></i>
            Secure sign-in
          </span>

        </div>

        <!-- Sign in button -->
        <button type="submit" id="loginButton"
          class="flex w-full items-center justify-center gap-3 rounded-2xl bg-gradient-to-r from-blue-600 to-blue-500 px-5 py-4 font-bold text-white shadow-lg shadow-blue-100 transition hover:from-blue-700 hover:to-blue-600 active:scale-[0.99]">

          <span id="buttonText">Sign in as Student</span>
          <i data-lucide="arrow-right" class="h-5 w-5"></i>
        </button>

        <!-- Message -->
        <p id="message" class="hidden rounded-xl bg-blue-50 p-4 text-sm text-blue-700"
          role="status"></p>

      </form>

      <!-- Registration -->
      <div class="my-9 flex items-center gap-4">
        <div class="h-px flex-1 bg-slate-200"></div>

        <span class="whitespace-nowrap text-xs font-medium text-slate-400">
          NEW TO PLACESENSE?
        </span>

        <div class="h-px flex-1 bg-slate-200"></div>
      </div>

      <p class="text-center text-sm text-slate-500">
        Don't have an account?

        <button type="button" id="registerButton"
          class="font-bold text-blue-600 hover:text-blue-800">
          Create account
        </button>
      </p>

      <!-- Footer -->
      <div class="mt-10 flex items-center justify-center gap-2 text-xs text-slate-400">
        <i data-lucide="shield-check" class="h-4 w-4"></i>
        Your information deserves to stay protected.
      </div>

    </div>
  </main>

  <script>
    lucide.createIcons();

    let selectedRole = "Student";

    // Role selection
    const roleButtons = document.querySelectorAll(".role-btn");
    const buttonText = document.getElementById("buttonText");

    roleButtons.forEach(button => {
      button.addEventListener("click", function () {
        selectedRole = this.dataset.role;

        roleButtons.forEach(btn => btn.classList.remove("active"));
        this.classList.add("active");

        buttonText.textContent = "Sign in as " + selectedRole;
      });
    });

    // Show / hide password
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
      const hidden = password.type === "password";

      password.type = hidden ? "text" : "password";

      togglePassword.innerHTML = hidden
        ? '<i data-lucide="eye-off" class="h-5 w-5"></i>'
        : '<i data-lucide="eye" class="h-5 w-5"></i>';

      togglePassword.setAttribute(
        "aria-label",
        hidden ? "Hide password" : "Show password"
      );

      lucide.createIcons();
    });

    // Frontend-only form submission
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const message = document.getElementById("message");

      message.textContent =
        "Demo only: " + selectedRole +
        " login form submitted for " + email +
        ". No authentication has taken place.";

      message.classList.remove("hidden");
    });

    // Demo buttons
    document.getElementById("forgotPassword").addEventListener("click", function () {
      showMessage("Password reset page can be added separately.");
    });

    document.getElementById("registerButton").addEventListener("click", function () {
      showMessage("Registration page can be created separately.");
    });

    function showMessage(text) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.classList.remove("hidden");
    }
  </script>

</body>
</html>
